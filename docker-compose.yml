services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishibot-backend
    restart: unless-stopped
    # Expose internally (for Caddy). Also publish on localhost so the API
    # is directly callable for development / health checks. Caddy is still
    # the public entrypoint on the droplet (ports 80/443).
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    # App secrets and per-environment overrides live in backend/.env
    # (gitignored). Compose loads them straight into the container.
    env_file:
      - ./backend/.env
    # Pinned overrides: these always take precedence over backend/.env.
    # DATABASE_URL must point at the volume mount; CORS_ORIGINS is set by
    # the host operator (different per deployment); DEBUG=False in prod.
    environment:
      - DATABASE_URL=sqlite:////app/data/krishibot.db
      - DEBUG=False
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # SQLite DB lives on the host so it survives container rebuilds.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: krishibot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Override at runtime when you switch to a real domain:
      #   DOMAIN=api.example.com docker compose up -d
      - DOMAIN=${DOMAIN:-64-227-145-40.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
