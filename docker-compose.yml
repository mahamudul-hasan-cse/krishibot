services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishibot-backend
    restart: unless-stopped
    # No published ports — Caddy reaches it via the internal network.
    expose:
      - "8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/krishibot.db
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-qwen2.5:3b}
      - DEBUG=False
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # SQLite DB lives on the host so it survives container rebuilds.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: krishibot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Override at runtime when you switch to a real domain:
      #   DOMAIN=api.example.com docker compose up -d
      - DOMAIN=${DOMAIN:-64-227-145-40.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
